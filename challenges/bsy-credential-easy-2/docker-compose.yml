services:
  ghost-paste:
    build: .
    image: scl-challenge-frame-10bebb
    container_name: scl-challenge-frame-10bebb
    hostname: ghost-paste
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    command: ["python3", "/app/server.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  playground-net:
    external: true
