services:
  scoreboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: scl-challenge-frame-a79f04:latest
    container_name: scl-challenge-frame-a79f04
    hostname: neon-ladder
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    entrypoint: ["/bin/sh", "/usr/local/bin/seed.sh"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a scoreboard ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  playground-net:
    external: true
