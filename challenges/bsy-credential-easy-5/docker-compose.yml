services:
  paste-relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: scl-challenge-frame-fcfea4:latest
    container_name: scl-challenge-frame-fcfea4
    hostname: midnight-relay
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    environment:
      FTP_PORT: "2121"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',2121),2); s.recv(128); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: ["python3", "/app/server.py"]
    working_dir: /app
    user: "65534:65534"

networks:
  playground-net:
    external: true
