services:
  shift-board:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: scl-challenge-frame-81f815-board
    container_name: scl-challenge-frame-81f815-board
    hostname: shift-board
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
  actuator-store:
    build:
      context: ./redis
      dockerfile: Dockerfile
    image: scl-challenge-frame-81f815-store
    container_name: scl-challenge-frame-81f815-store
    hostname: actuator-store
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.142
    environment:
      REDIS_PASSWORD: "midnight-shift-27"
    command: ["sh", "/srv/start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  playground-net:
    external: true
