services:
  archive:
    build: ./web
    image: scl-challenge-frame-b4ad14-web:latest
    container_name: scl-challenge-frame-b4ad14-web
    hostname: station-archive
    working_dir: /app
    command: ["python3", "/app/http_service.py"]
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
  airlock-db:
    build: ./db
    image: scl-challenge-frame-b4ad14-db:latest
    container_name: scl-challenge-frame-b4ad14-db
    hostname: airlock-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: station_admin_unused
      POSTGRES_DB: airlock
      POSTGRES_INITDB_ARGS: --auth-host=md5 --auth-local=trust
    networks:
      playground-net:
        ipv4_address: 172.20.0.142
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airlock"]
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  playground-net:
    external: true
