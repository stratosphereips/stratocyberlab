services:
  roster-web:
    build: ./web
    image: scl-challenge-frame-dcaf9d-web:latest
    container_name: scl-challenge-frame-dcaf9d-web
    hostname: roster-web
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  roster-imap:
    build: ./imap
    image: scl-challenge-frame-dcaf9d-imap:latest
    container_name: scl-challenge-frame-dcaf9d-imap
    hostname: roster-imap
    networks:
      playground-net:
        ipv4_address: 172.20.0.142
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',143),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  playground-net:
    external: true
