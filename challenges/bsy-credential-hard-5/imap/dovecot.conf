protocols = imap
listen = *
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:/var/mail/%u/Maildir
namespace inbox {
  inbox = yes
}
passdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=10001 gid=10001 home=/var/mail/%u
}
