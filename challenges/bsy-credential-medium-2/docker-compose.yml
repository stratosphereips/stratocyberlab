services:
  ghostline-relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: scl-challenge-frame-02899e-ghostline-relay
    container_name: scl-challenge-frame-02899e-ghostline-relay
    hostname: ghostline-relay
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    command: ["python3", "/srv/service.py"]
networks:
  playground-net:
    external: true
