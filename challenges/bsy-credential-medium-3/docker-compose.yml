services:
  actuator:
    build: .
    image: scl-challenge-frame-35d3f8:latest
    container_name: scl-challenge-frame-35d3f8
    hostname: actuator-console
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.147
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 21), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
networks:
  playground-net:
    external: true
