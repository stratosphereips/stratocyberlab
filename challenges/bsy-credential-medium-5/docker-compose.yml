services:
  paste-db:
    build: .
    image: scl-challenge-frame-fc7edb-db
    container_name: scl-challenge-frame-fc7edb-db
    hostname: paste-db
    stop_grace_period: 10s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    environment:
      POSTGRES_PASSWORD: local-range-root
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "password_encryption=md5"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  playground-net:
    external: true
