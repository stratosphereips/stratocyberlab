services:
  relay:
    build: ./relay
    image: scl-challenge-frame-e834df-relay
    container_name: scl-challenge-frame-e834df-relay
    hostname: mars-relay
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 18883 -t rover/telemetry/archive -C 1 -W 2 >/dev/null 2>&1"]
      interval: 10s
      timeout: 4s
      retries: 3
    stop_grace_period: 5s
  decoys:
    build: ./decoys
    image: scl-challenge-frame-e834df-decoys
    container_name: scl-challenge-frame-e834df-decoys
    hostname: mars-ground-stubs
    networks:
      playground-net:
        ipv4_address: 172.20.0.142
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',80),2); s.close()"]
      interval: 10s
      timeout: 4s
      retries: 3
    stop_grace_period: 5s
networks:
  playground-net:
    external: true
