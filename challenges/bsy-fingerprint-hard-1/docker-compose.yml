services:
  bbs-gateway:
    build: .
    image: scl-challenge-frame-705f0b:latest
    container_name: scl-challenge-frame-705f0b
    hostname: neon-bbs
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "45117", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  playground-net:
    external: true
