services:
  terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: scl-challenge-frame-80014a:latest
    container_name: scl-challenge-frame-80014a-terminal
    hostname: dead-letter-mainframe
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',25252),2); s.recv(128); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    working_dir: /app
    user: nobody
    command: ["python3", "/app/server.py"]

networks:
  playground-net:
    external: true
