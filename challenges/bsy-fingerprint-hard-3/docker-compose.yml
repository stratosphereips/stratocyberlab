services:
  door-controller:
    build: .
    image: scl-challenge-frame-ae63e3:latest
    container_name: scl-challenge-frame-ae63e3
    hostname: door-controller
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "python3", "/app/service.py", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  playground-net:
    external: true
