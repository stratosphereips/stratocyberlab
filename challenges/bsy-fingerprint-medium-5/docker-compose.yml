services:
  relay:
    build: .
    image: scl-challenge-frame-310837:latest
    container_name: scl-challenge-frame-310837-relay
    hostname: derelict-relay
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',25252),2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: ["python3", "/app/service.py"]
networks:
  playground-net:
    external: true
