services:
  gateway:
    build: .
    image: scl-challenge-frame-59e8ae
    container_name: scl-challenge-frame-59e8ae
    hostname: frame-gateway
    stop_grace_period: 10s
    networks:
      playground-net:
        ipv4_address: 172.20.0.159
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: ["/usr/sbin/sshd", "-D", "-e"]

networks:
  playground-net:
    external: true
