services:
  build-server:
    build: .
    image: scl-challenge-frame-a59eb3:latest
    container_name: scl-challenge-frame-a59eb3
    hostname: build-orbit-7
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.147
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: ["/usr/sbin/sshd", "-D", "-e"]
networks:
  playground-net:
    external: true
