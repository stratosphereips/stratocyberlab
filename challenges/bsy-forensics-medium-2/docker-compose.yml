services:
  jump-host:
    build: .
    image: scl-challenge-frame-f86b8d:latest
    container_name: scl-challenge-frame-f86b8d
    hostname: station-jump
    stop_grace_period: 10s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',22),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
networks:
  playground-net:
    external: true
