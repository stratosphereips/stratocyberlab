services:
  node:
    build: .
    image: scl-challenge-lunar-node
    container_name: scl-challenge-lunar-node
    hostname: lunar-node
    stop_grace_period: 10s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/22'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    entrypoint: ["/usr/local/sbin/start-services"]
networks:
  playground-net:
    external: true
