services:
  relay:
    build: .
    image: scl-challenge-frame-a6a766:latest
    container_name: scl-challenge-frame-a6a766-relay
    hostname: telemetry-relay
    stop_grace_period: 10s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/22'"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: ["/usr/sbin/sshd", "-D", "-e"]

networks:
  playground-net:
    external: true
