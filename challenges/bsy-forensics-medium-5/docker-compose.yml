services:
  bulletin-board:
    build: .
    image: scl-challenge-frame-ebf0f2:latest
    container_name: scl-challenge-frame-ebf0f2
    hostname: board-archive
    stop_grace_period: 10s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -T 2 127.0.0.1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: ["/usr/sbin/sshd", "-D", "-e"]
networks:
  playground-net:
    external: true
