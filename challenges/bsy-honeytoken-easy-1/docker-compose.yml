services:
  ghost-cache:
    build: .
    image: scl-challenge-frame-003f19:latest
    container_name: scl-challenge-frame-003f19
    hostname: ghost-cache
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 21), timeout=2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  playground-net:
    external: true
