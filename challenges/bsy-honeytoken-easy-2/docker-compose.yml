services:
  bank-api:
    build: .
    image: scl-challenge-frame-663bf3-api
    container_name: scl-challenge-frame-663bf3-api
    hostname: asterion-bank-api
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: ["python3", "/app/service.py"]

networks:
  playground-net:
    external: true
