services:
  bbs:
    build: .
    image: scl-challenge-frame-b8c0e2-bbs
    container_name: scl-challenge-frame-b8c0e2-bbs
    hostname: echo-bbs
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',25),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 3
networks:
  playground-net:
    external: true
