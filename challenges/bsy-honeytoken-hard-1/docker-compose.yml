services:
  roster:
    build: .
    image: scl-challenge-frame-21976e:latest
    container_name: scl-challenge-frame-21976e-roster
    hostname: ghost-roster
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.147
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
networks:
  playground-net:
    external: true
