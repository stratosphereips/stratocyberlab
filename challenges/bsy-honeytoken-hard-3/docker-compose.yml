services:
  ledger-dns:
    build: .
    image: scl-challenge-frame-a3face
    container_name: scl-challenge-frame-a3face
    hostname: ledger-dns
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 bank.test SOA +short | grep -q ns.bank.test"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: ["named", "-g", "-c", "/etc/bind/named.conf"]

networks:
  playground-net:
    external: true
