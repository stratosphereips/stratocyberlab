services:
  relay:
    build: .
    image: scl-challenge-frame-6e4473:latest
    container_name: scl-challenge-frame-6e4473-relay
    hostname: relay
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.147
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  playground-net:
    external: true
