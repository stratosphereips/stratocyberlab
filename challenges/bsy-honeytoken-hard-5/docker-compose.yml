services:
  vault:
    build: .
    image: scl-challenge-frame-ae08ec
    container_name: scl-challenge-frame-ae08ec-vault
    hostname: blackglass-vault
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.147
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: ["python3", "/app/service.py"]

networks:
  playground-net:
    external: true
