services:
  bbs:
    build: .
    image: scl-challenge-frame-0a220a:latest
    container_name: scl-challenge-frame-0a220a-bbs
    hostname: relay-bbs
    stop_grace_period: 5s
    command: ["python3", "/app/server.py"]
    working_dir: /app
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141

networks:
  playground-net:
    external: true
