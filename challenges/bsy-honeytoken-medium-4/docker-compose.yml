services:
  vault:
    build: .
    image: scl-challenge-frame-837923-vault
    container_name: scl-challenge-frame-837923-vault
    hostname: ghostlight-vault
    stop_grace_period: 10s
    networks:
      playground-net:
        ipv4_address: 172.20.0.147
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "health", "--pass", "healthcheck-only", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    entrypoint: ["/opt/seed.sh"]
networks:
  playground-net:
    external: true
