services:
  mainframe:
    build: .
    image: scl-challenge-frame-c8cacf:latest
    container_name: scl-challenge-frame-c8cacf
    hostname: mainframe
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/22'"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  playground-net:
    external: true
