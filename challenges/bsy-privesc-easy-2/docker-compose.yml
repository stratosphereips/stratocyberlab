services:
  gateway:
    build: .
    image: scl-challenge-frame-c20132:latest
    container_name: scl-challenge-frame-c20132
    hostname: frame-gateway
    stop_grace_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.182
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',22),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: ["/usr/sbin/sshd", "-D", "-e"]

networks:
  playground-net:
    external: true
