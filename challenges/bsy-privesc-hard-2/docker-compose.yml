services:
  build-node:
    build: .
    image: scl-challenge-frame-c318b1:latest
    container_name: scl-challenge-frame-c318b1
    hostname: blackglass-build
    stop_grace_period: 10s
    networks:
      playground-net:
        ipv4_address: 172.20.0.147
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: ["/usr/sbin/sshd", "-D", "-e"]

networks:
  playground-net:
    external: true
