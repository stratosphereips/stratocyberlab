services:
  build-node:
    build: .
    image: scl-challenge-frame-f78e9a:latest
    container_name: scl-challenge-frame-f78e9a
    hostname: frame-build-node
    stop_grace_period: 10s
    networks:
      playground-net:
        ipv4_address: 172.20.0.141
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',22),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  playground-net:
    external: true
