services:
  gateway:
    build: .
    image: scl-challenge-frame-5b0109:latest
    container_name: scl-challenge-frame-5b0109
    hostname: frame-gateway
    stop_grace_period: 10s
    networks:
      playground-net:
        ipv4_address: 172.20.0.147
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',22),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  playground-net:
    external: true
