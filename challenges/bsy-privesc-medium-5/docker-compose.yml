services:
  frame:
    build: .
    image: scl-challenge-frame-a3450d:latest
    container_name: scl-challenge-frame-a3450d
    hostname: smartgrid-ops-07
    stop_grace_period: 10s
    command: ["/usr/sbin/sshd", "-D", "-e"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',22),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      playground-net:
        ipv4_address: 172.20.0.147
networks:
  playground-net:
    external: true
