version: '3.3'

services:
  class-09-exploit-lab:
    build: exploit-lab/
    image: scl-class-09-exploitation-lab  # name of the built image
    container_name: scl-class-09-exploitation-lab
    platform: linux/amd64 # important
    restart: on-failure
    security_opt:
      - seccomp:/classes/class09/exploit-lab/seccomp-profile.json
    stop_grace_period: 0s
    hostname: class9-exploitation-lab

    networks:
      playground-net:
        ipv4_address: 172.20.0.115

  class-09-exercise:
    build: exercise/
    image: scl-class-09-exercise  # name of the built image
    container_name: scl-class-09-exercise
    platform: linux/amd64 # important
    restart: on-failure
    stop_grace_period: 0s
    hostname: class9-exercise

    networks:
      playground-net:
        ipv4_address: 172.20.0.116


networks:
  playground-net:
    external: true
