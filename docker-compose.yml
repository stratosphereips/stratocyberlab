services:
  hackerlab:
    build: ./hackerlab
    image: scl-hackerlab  # name of the built image
    container_name: scl-hackerlab
    hostname: hackerlab
    restart: on-failure
    volumes:
      - ./hackerlab/data:/data
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:2223:8080"
    networks:
      playground-net:
        ipv4_address: 172.20.0.2

  dashboard:
    build:
      context: .   # ugly hack - context is "parent" directory for access to .git to read current commit hash
      dockerfile: ./dashboard/Dockerfile
    image: scl-dashboard  # name of the built image
    container_name: scl-dashboard
    hostname: dashboard
    restart: on-failure
    # Allow background task cancellation and managed-container cleanup.
    stop_grace_period: 2m
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:8080:8080"
    networks:
      playground-net:
        ipv4_address: 172.20.0.3
    volumes:
      - ./classes:/classes
      - ./challenges:/challenges
      - ./campaigns:/campaigns
      - ./plugins:/plugins
      - ./data/dashboard:/var/opt/app/data
      # Inspect this mount to reuse Docker's host path when starting on-demand Ollama container.
      - ./ollama:/ollama:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "'import requests; response = requests.get(\"http://localhost:80/\"); assert response.status_code == 200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  playground-net:
    name: "playground-net"
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
